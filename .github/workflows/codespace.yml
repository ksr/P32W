# codespace -- builds the codespace's container (.devcontainer) on Linux and checks that
# P32W boots and runs in it (.devcontainer/check.sh). Only when started: from the Actions
# tab, or gh workflow run codespace.yml; "full" runs the whole test suite too (an hour),
# and "run" a command of one's own in the container instead (to look into a failure).
name: codespace
on:
  workflow_dispatch:
    inputs:
      full:
        description: "the whole test suite too (about an hour)"
        type: boolean
        default: false
      run:
        description: "instead of the checks: a command to run in the container"
        type: string
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @devcontainers/cli
      - run: devcontainer up --workspace-folder .
      - if: inputs.run == ''
        run: devcontainer exec --workspace-folder . env FULL=${{ inputs.full && '1' || '' }} sh .devcontainer/check.sh
      - if: inputs.run != ''
        env:
          RUN: ${{ inputs.run }}
        run: devcontainer exec --workspace-folder . sh -c "$RUN"
