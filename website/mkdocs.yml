# Author: Claude (Anthropic) for Ken Rother, 2026
# The P32W project website: MkDocs 1.6 + Material over the documents stage.py copies from this repository.
# ./build.sh builds it (website/README.md).
site_name: P32W
repo_url: https://github.com/ksr/P32W
repo_name: ksr/P32W
edit_uri: blob/main/
site_description: A 32-bit homebrew computer from 74-series logic, GALs, SRAM and flash on a 10-slot backplane, and P32W Unix, a multi-user V6-style Unix in C.
site_author: Ken Rother
docs_dir: stage
site_dir: site
use_directory_urls: true
copyright: "P32W by Ken Rother — <a href=\"https://cottageworker.com\">cottageworker.com</a> · Email ken at cottage worker dot com"
hooks:
  - hooks.py
  - lastupdated.py                 # "Last updated <date>" at the foot of every page

theme:
  name: material
  custom_dir: overrides           # the cottageworker.com bar at the top of every page
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - admonition
  - pymdownx.superfences
  - pymdownx.details

nav:
