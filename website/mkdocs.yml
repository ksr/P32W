  - Home P32W: index.md
  - The machine:
      - System architecture: docs/architecture.md
      - Design decisions: docs/decisions.md
      - Microarchitecture: docs/microarch.md
      - Microcode: microcode/README.md
      - The bus: docs/bus.md
      - Timing: docs/timing.md
      - Power budget: docs/power-budget.md
      - Speeding up the CPU: docs/speed.md
      - The boot sequence: docs/boot.md
      - A PDP-11/23 on P32W hardware: docs/pdp11-analysis.md
      - The books (PDF): books.md
  - Cards:
      - Backplane:
          - The backplane: docs/backplane.md
          - Theory of operation: docs/backplane-theory.md
          - The board: hardware/backplane/board.md
      - CPU card:
          - The CPU card: docs/cpu-card.md
          - Theory of operation: docs/cpu-card-theory.md
          - The board: hardware/cpu-card/board.md
      - MMU / data card:
          - The MMU / data card: docs/mmu-card.md
